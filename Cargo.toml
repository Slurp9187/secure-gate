[workspace]
members = ["secure-gate-core"]
# The nested fuzz crate declares its own `[workspace]`, so this is belt and braces
# rather than load-bearing today.
exclude = ["secure-gate-core/fuzz"]
resolver = "2"

[workspace.package]
version = "0.9.0-rc.9"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Slurp9187/secure-gate"
