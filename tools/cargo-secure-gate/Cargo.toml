[package]
name = "cargo-secure-gate"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Source-level audit checks for secure-gate consumers: FixedStorage assertions and Dynamic::new_with pre-sizing."
publish = false

# A deliberate second workspace root, for the same reason `fuzz/` is one.
# `secure-gate` advertises a two-line `cargo tree`; nothing here may ever appear
# in it. The library's `include` list does not name `tools/`, so this directory
# is absent from the published package as well.
[workspace]

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
walkdir = "2"
