[package]
name = "secure-gate-compat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Compatibility layer providing drop-in secrecy shims for secure-gate"
repository = "https://github.com/Slurp9187/secure-gate/tree/main/secure-gate-compat"
documentation = "https://docs.rs/secure-gate-compat"
keywords = ["crypto", "security", "zeroize", "secrecy", "compat"]
categories = ["cryptography", "no-std", "data-structures"]
include = [
    "src/**/*.rs",
    "CHANGELOG.md",
    "LICENSE*",
    "MIGRATING_FROM_SECRECY.md",
    "README.md",
    "SECURITY.md",
]

[dependencies]
secure-gate = { path = "../secure-gate-core", version = "0.9.0-rc.8" }
zeroize = { version = "1.8", default-features = false }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
# `#[derive(Zeroize)]` in the compat test suite. Previously arrived by feature
# unification from `secure-gate`, which no longer enables `zeroize_derive`; the
# shim itself does not need it, and neither does real `secrecy` (0.8 and 0.10 both
# depend on `zeroize` with default-features = false).
zeroize = { version = "1.8", default-features = false, features = ["zeroize_derive"] }
# Dual-parity testing baselines — pinned exact versions matching local source clones.
# These compile as dev-deps always; the dual-compat-test feature gates the test module.
secrecy-v08 = { package = "secrecy", version = "=0.8.0" }
secrecy-v10 = { package = "secrecy", version = "=0.10.1" }
trybuild = "1.0"
serde_json = "1.0"
proptest = "1.10"

[features]
# secrecy compatibility shims — drop-in replacements for secrecy v0.8.0 and v0.10.1.
#
# The shim modules themselves always compile: `secure_gate_compat::compat::v10`
# (SecretBox/SecretString/SecretSlice) and `::v08` (Secret/SecretString/SecretVec/
# DebugSecret) carry no `cfg` on this feature. What the feature does is turn on what
# those shims need in order to be complete and exercised — `secure-gate`'s `alloc`,
# `cloneable`, and `serde-serialize`, plus this crate's `serde` dependency — and gate
# the entire test surface: `tests/compat_suite/` (one `#![cfg]` at the suite root),
# `tests/finding5_regression.rs`, `tests/migration_full.rs`, the compat trybuild cases,
# and, through `dual-compat-test`, the side-by-side parity tests in `tests/compat_dual/`.
# Building without it type-checks the shims and runs none of their tests, which is what
# the `no features` CI row is for.
#
# Note: this does NOT enable this crate's own `serde-serialize` / `serde-deserialize`
# features, so the shims' `Serialize` / `Deserialize` impls stay off unless you ask for
# them (`--features secrecy-compat,serde-serialize`). Cargo's `secure-gate/serde-serialize`
# names the dependency's feature, not the same-named one below.
#
# Shared traits (ExposeSecret, CloneableSecret, zeroize re-export) live in compat root.
# See `src/compat/` for the full migration guides.
secrecy-compat = ["secure-gate/alloc", "secure-gate/cloneable", "secure-gate/serde-serialize", "serde"]

# Enables side-by-side parity tests in tests/compat_dual/ that run the exact same
# test body against both the real `secrecy` crate and the compat shim, proving drop-in
# identity. Implies secrecy-compat. Real secrecy dev-deps are always compiled (they are
# ordinary dev-dependencies); this feature just activates the test module.
dual-compat-test = ["secrecy-compat"]

alloc = ["secure-gate/alloc"]
ct-eq = ["secure-gate/ct-eq"]
# Each pulls in `dep:serde` as well as the core feature: the `#[cfg(feature = ...)]`
# blocks in `src/compat/` name `serde` types directly, so without it these features
# do not compile on their own.
serde-deserialize = ["secure-gate/serde-deserialize", "serde"]
serde-serialize = ["secure-gate/serde-serialize", "serde"]
serde = ["dep:serde"]

[[test]]
name = "migration_full"
path = "tests/migration_full.rs"
harness = false
