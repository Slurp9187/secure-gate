name: DSE zeroization check

# The DSE asm-grep test in tests/asm_dse_check.rs is gated to
# x86_64 (cfg(target_arch = "x86_64")). It checks both AT&T
# (ubuntu-latest) and Intel (windows-latest, MSVC) syntax.
# ARM64 macOS runners (macos-latest) silently skip the test
# and are therefore not in the matrix; if x86_64 macOS coverage
# is needed, switch to macos-13.

# Path filters: the guard covers the zeroize-on-drop code paths, the binary the
# test compiles, and the test itself. Every other push/PR workflow in this repo is
# filtered the same way; without one, a docs- or changelog-only commit spends four
# release builds re-proving assembly that did not change.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/asm_dse_check.rs"
      - "Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/dse-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/asm_dse_check.rs"
      - "Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/dse-check.yml"

permissions:
  contents: read

jobs:
  dse-check:
    name: DSE - volatile zero-store survival (${{ matrix.os }}, ${{ matrix.toolchain }})
    # Push/PR only. The weekly cron is served by `dse-check-scheduled` below, which
    # also covers `release/0.8` — a `schedule:` block on that branch would never fire
    # (GitHub only raises scheduled events from the default branch), so the LTS line
    # has to be reached from here. See #169.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    # A release build of `asm_check` plus its deps in an isolated target dir; the
    # slowest leg (windows-latest) runs well inside this. Without it the job would
    # inherit GitHub's 360-minute default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable, nightly]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run DSE check (${{ matrix.toolchain }})
        run: >
          cargo +${{ matrix.toolchain }} test
          -p secure-gate
          --release
          --test asm_dse_check
          -- --ignored --nocapture

  # Weekly cross-branch run. `release/0.8` cannot schedule itself, so its DSE
  # coverage lives here and checks the branch out explicitly — the same pattern
  # `audit.yml` already uses for `cargo audit`. See #169.
  dse-check-scheduled:
    name: DSE - ${{ matrix.ref }} (${{ matrix.os }}, ${{ matrix.toolchain }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: [main, "release/0.8"]
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable, nightly]
    steps:
      - name: Checkout ${{ matrix.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Install Rust ${{ matrix.toolchain }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}

      # No dependency cache in this job, deliberately. It runs in the default
      # branch's privilege context (schedule / workflow_dispatch) while checking out
      # a *different* ref, so writing a shared cache here is the cache-poisoning
      # pattern CodeQL flags as `actions/cache-poisoning/poisonable-step` — a
      # compromised `release/0.8` could plant artifacts that `main`'s builds later
      # restore and execute. A weekly job does not need the speedup.

      - name: Run DSE check (${{ matrix.ref }}, ${{ matrix.toolchain }})
        run: >
          cargo +${{ matrix.toolchain }} test
          -p secure-gate
          --release
          --test asm_dse_check
          -- --ignored --nocapture
