name: CI release/0.8

on:
  workflow_dispatch:
  push:
    branches: [release/0.8]
    paths:
      - "secure-gate-core/**"
      - "secure-gate-compat/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-0.8.yml"
  pull_request:
    branches: [release/0.8]
    paths:
      - "secure-gate-core/**"
      - "secure-gate-compat/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-0.8.yml"

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt – check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pin to this branch's toolchain (rust-toolchain.toml, 1.70): rustfmt
      # output differs across toolchains, and the tree is formatted with 1.70.
      - name: Install Rust 1.70 + rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.70"
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo +1.70 fmt --all --check

  lint:
    name: Lint (${{ matrix.package }}/${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no features
            package: secure-gate
            features: "--no-default-features"
          - name: rand (no_std)
            package: secure-gate
            features: "--no-default-features --features=rand"
          - name: full
            package: secure-gate
            features: "--features=full"
          - name: all features
            package: secure-gate
            features: "--all-features"
          - name: no features
            package: secure-gate-compat
            features: "--no-default-features"
          - name: rand (no_std)
            package: secure-gate-compat
            features: "--no-default-features --features=rand"
          - name: full
            package: secure-gate-compat
            features: "--features=full"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Clippy (${{ matrix.name }})
        run: cargo clippy -p ${{ matrix.package }} --tests --benches ${{ matrix.features }}

      - name: Doctests (${{ matrix.name }})
        run: cargo test -p ${{ matrix.package }} --doc ${{ matrix.features }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Baseline ──────────────────────────────────────────────────────────
          - name: Default features
            features: ""

          - name: No features
            features: "--no-default-features"

          # ── Alloc / std ──────────────────────────────────────────────────
          - name: alloc explicit
            features: "--no-default-features --features=alloc"

          - name: std explicit
            features: "--no-default-features --features=std"

          # ── Rand ──────────────────────────────────────────────────────────────
          # rand no longer forces alloc: Fixed::from_random() works without heap.
          # Dynamic::from_random() is covered by the alloc + rand entry below.
          - name: rand (no_std, Fixed only)
            features: "--no-default-features --features=rand"

          - name: alloc + rand
            features: "--no-default-features --features=alloc,rand"

          # ── Constant-time equality ────────────────────────────────────────────
          # alloc is required so Dynamic-backed tests in ct_eq_tests and
          # proptest_suite/ct_eq.rs (gated on ct-eq + alloc) are exercised.
          - name: ct-eq + alloc
            features: "--no-default-features --features=ct-eq,alloc"

          # ── Encoding ──────────────────────────────────────────────────────────
          # Encoding traits return String and require alloc; integration tests
          # import the traits, so alloc is needed to compile the test binaries.
          - name: encoding (all formats)
            features: "--no-default-features --features=alloc,encoding"

          - name: encoding-hex only
            features: "--no-default-features --features=alloc,encoding-hex"

          - name: encoding-base32 only
            features: "--no-default-features --features=alloc,encoding-base32"

          - name: encoding-base64 only
            features: "--no-default-features --features=alloc,encoding-base64"

          - name: encoding-bech32 only
            features: "--no-default-features --features=alloc,encoding-bech32"

          - name: encoding-bech32m only
            features: "--no-default-features --features=alloc,encoding-bech32m"

          - name: encoding-bech32 + bech32m
            features: "--no-default-features --features=alloc,encoding-bech32,encoding-bech32m"

          # ── Serde ─────────────────────────────────────────────────────────────
          - name: serde (serialize + deserialize)
            features: "--no-default-features --features=serde"

          - name: serde-serialize only
            features: "--no-default-features --features=serde-serialize"

          - name: serde-deserialize only
            features: "--no-default-features --features=serde-deserialize"

          # ── Cloneable ─────────────────────────────────────────────────────────
          - name: alloc + cloneable
            features: "--no-default-features --features=alloc,cloneable"

          # ── Full ──────────────────────────────────────────────────────────────
          - name: full
            features: "--features=full"

          # `full` deliberately excludes `std`, so tests gated on `std` together
          # with another feature (e.g. the reader/writer forwarding on a
          # `dynamic_newtype!` over `Vec<u8>`, which needs `std` + `encoding-hex`)
          # compile in no other matrix entry. This one compiles all of them.
          - name: all features (full + std)
            features: "--all-features"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests (${{ matrix.name }})
        # The trybuild snapshots are blessed against this branch's pinned
        # toolchain (rust-toolchain.toml, 1.70). Stable rustc diagnostics drift
        # over time (dynamic_string_no_hex broke when stable switched E0599's
        # candidate note to a single-line form), so skip those cases here; the
        # `compile-fail` job below runs them on 1.70. `--skip` matches
        # substrings, and every compile-fail test is named `*_compile_fail`, so
        # new cases are excluded automatically. The one legacy name without the
        # suffix is listed explicitly.
        run: cargo test -p secure-gate --tests ${{ matrix.features }} -- --skip compile_fail --skip serializable_secret_misuse

  # ---------------------------------------------------------------------------
  # Release-profile test job — build-invariance oracle
  #
  # The error API guarantees identical shapes and messages in debug and release
  # builds, and several tests assert exact Display output. The matrix above runs
  # the debug profile only, so run the runtime suites once under --release to
  # keep the build-invariance property continuously verified.
  #
  # trybuild compile-fail tests are skipped in both crates: they assert compiler
  # diagnostics (blessed against the pinned toolchain) which drift on stable and
  # are independent of the build profile — the property this job guards is
  # runtime behavior. Core cases are skipped by the `compile_fail` name suffix
  # (plus the one legacy name); keep the compat list in sync with the test
  # names in secure-gate-compat/tests/compile_fail_tests.rs.
  # ---------------------------------------------------------------------------
  test-release:
    name: Test – release profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run core tests (release, full features)
        run: cargo test -p secure-gate --tests --release --features=full -- --skip compile_fail --skip serializable_secret_misuse

      - name: Run compat tests (release, all features)
        run: cargo test -p secure-gate-compat --release --all-features -- --skip fixed_alias_zero_size_compile_fail --skip serializable_secret_misuse --skip compat_no_deref --skip compat_no_asref --skip compat_no_debug_without_marker

  # ---------------------------------------------------------------------------
  # no_std job — cross-build for a bare-metal target
  #
  # The hosted "--no-default-features" jobs above silently link std, so they
  # cannot catch std leakage (missing #![no_std], dependencies with default
  # `std` features, prelude-only type usage). Cross-building for a target with
  # no std at all is the only authoritative check. `rand` is excluded: it needs
  # a user-configured getrandom backend on bare metal (documented in lib.rs).
  # ---------------------------------------------------------------------------
  no-std:
    name: no_std – cross-build (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable + thumbv7em target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cross-build library for bare metal (feature matrix)
        run: |
          set -eux
          for features in \
            "" \
            "encoding-hex" \
            "encoding-base32" \
            "encoding-base64" \
            "encoding-bech32" \
            "encoding-bech32m" \
            "encoding-hex,encoding-base32,encoding-base64,encoding-bech32,encoding-bech32m" \
            "ct-eq" \
            "ct-eq,encoding-hex,encoding-base32,encoding-base64,encoding-bech32,encoding-bech32m"
          do
            cargo build -p secure-gate --lib \
              --target thumbv7em-none-eabihf \
              --no-default-features \
              ${features:+--features "$features"}
          done

      - name: Cross-build compat for bare metal
        # secure-gate-compat is unconditionally #![no_std] (alloc-based shims).
        run: |
          set -eux
          cargo build -p secure-gate-compat --lib --target thumbv7em-none-eabihf
          cargo build -p secure-gate-compat --lib --target thumbv7em-none-eabihf --features secrecy-compat

  # ---------------------------------------------------------------------------
  # MSRV job — verify declared rust-version is actually buildable
  #
  # Runs `cargo check` (not full tests) on the MSRV toolchain to catch any
  # accidental use of post-1.70 APIs before they reach a release. Clippy's
  # --version-lint flag catches MSRV violations in the main `test` job, but
  # a real toolchain check is the authoritative guard.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV – cargo check (1.70)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.70
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.70"

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo check – default features (core)
        run: cargo +1.70 check -p secure-gate --locked

      - name: cargo check – full features (core)
        run: cargo +1.70 check -p secure-gate --locked --features=full

      - name: cargo check – default features (compat)
        run: cargo +1.70 check -p secure-gate-compat --locked

      - name: cargo check – full features (compat)
        run: cargo +1.70 check -p secure-gate-compat --locked --features=full

      - name: cargo test – all features (core, MSRV compatibility)
        # Skip compile-fail tests: they verify diagnostic wording, not MSRV
        # compatibility. They are covered by the dedicated `compile-fail` job, which
        # runs the whole suite on 1.70. (They do not run in the stable `test` job —
        # that job skips them too, because the snapshots mismatch on stable.)
        run: cargo +1.70 test -p secure-gate --locked --all-features -- --skip compile_fail --skip serializable_secret_misuse

      - name: cargo test – all features (compat, MSRV compatibility)
        run: cargo +1.70 test -p secure-gate-compat --locked --all-features

  # ---------------------------------------------------------------------------
  # Compile-fail job — API-surface enforcement on the blessing toolchain
  #
  # The trybuild snapshots assert compiler diagnostics, which drift on stable, so
  # the stable jobs skip them by name and the MSRV job skipped them too. Each
  # pointed at the other — the stable job said they were covered by pinned runs,
  # the MSRV job said they run in the stable job — so in practice they ran in no
  # CI job at all, and the negative API guarantees (no `Deref`/`AsRef` on the
  # secret wrappers, no `Serialize` without `SerializableSecret`, no zero-size
  # aliases) were asserted in prose and enforced nowhere.
  #
  # This job runs exactly those tests, pinned to 1.70 — this branch's toolchain
  # (rust-toolchain.toml) and the one the .stderr files are blessed against — so
  # the diagnostics are stable by construction. Verified: all five snapshots pass
  # on 1.70 and every one of them mismatches on stable.
  # Regenerate snapshots with: TRYBUILD=overwrite cargo +1.70 test compile_fail
  # ---------------------------------------------------------------------------
  compile-fail:
    name: Compile-fail – trybuild (1.70)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.70
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.70"

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run core compile-fail tests
        run: cargo +1.70 test -p secure-gate --features=full --test compile_fail_tests

  # ---------------------------------------------------------------------------
  # AddressSanitizer job — heap zeroization oracle
  #
  # Runs only the `heap_zeroize` integration test binary with ASan + LeakSanitizer
  # enabled. Requires nightly + `-Z build-std` to rebuild std with instrumentation.
  # This job catches heap-use-after-free, buffer overflows, and memory leaks that
  # Miri and the ProxyAllocator approach might miss at the allocator level.
  # ---------------------------------------------------------------------------
  asan-heap:
    name: ASan – heap zeroization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly + rust-src
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rust-src

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run heap_zeroize with AddressSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=address -Zsanitizer=leak -C debuginfo=2"
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:symbolize=1"
        run: >
          cargo +nightly test -p secure-gate
          --features alloc
          --test heap_zeroize
          -Z build-std
          --target x86_64-unknown-linux-gnu
