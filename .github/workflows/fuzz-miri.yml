name: Fuzz (Miri UB checks)

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "fuzz/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  miri:
    # Push only. The weekly cron is served by `miri-scheduled` below, which also
    # covers `release/0.8` — a `schedule:` block on that branch would never fire
    # (GitHub raises scheduled events only from the default branch), so the LTS
    # line has to be reached from here. See #169.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust nightly with Miri
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri
          cache: true

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2

      - name: Setup Miri
        run: cargo miri setup

      - name: Run Miri on all other tests (strict)
        env:
          MIRIFLAGS: >-
            -Zmiri-ignore-leaks
            -Zmiri-disable-isolation
            -Zmiri-strict-provenance
        run: |
          cargo miri test --workspace --all-features -- --skip fixed_alias_zero_size_compile_fail --skip serializable_secret_misuse

      - name: Light corpus scan with Miri (weekly or manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          MIRIFLAGS: >-
            -Zmiri-ignore-leaks
            -Zmiri-disable-isolation
            -Zmiri-strict-provenance
        run: |
          echo "Starting light Miri corpus scan on fuzz targets (max 2 min each)..."
          for target in expose mut parsing encoding serde ct_eq; do
            echo "=== Miri scanning fuzz target: $target ==="
            timeout 120 cargo miri run --manifest-path fuzz/Cargo.toml --bin $target -- -max_total_time=60 || \
              echo "Warning: $target timed out or hit expected panic (ignored)"
          done
        continue-on-error: true

      - name: Upload Miri logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miri-failure-logs-${{ github.run_id }}
          path: |
            ~/.miri/**
            target/miri/**
            fuzz/artifacts/**
          retention-days: 14

  # Weekly cross-branch run. `release/0.8` cannot schedule itself, so its Miri
  # coverage lives here and checks the branch out explicitly — the same pattern
  # `audit.yml` already uses for `cargo audit`. See #169.
  miri-scheduled:
    name: Miri UB checks (${{ matrix.ref }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: [main, "release/0.8"]
    steps:
      - name: Checkout ${{ matrix.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Install Rust nightly with Miri
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri, rust-src

      # No dependency cache in this job, deliberately. It runs in the default
      # branch's privilege context (schedule / workflow_dispatch) while checking out
      # a *different* ref, so writing a shared cache here is the cache-poisoning
      # pattern CodeQL flags as `actions/cache-poisoning/poisonable-step` — a
      # compromised `release/0.8` could plant artifacts that `main`'s builds later
      # restore and execute. A weekly job does not need the speedup.

      - name: Setup Miri
        run: cargo miri setup

      # `--workspace` is retained rather than `-p secure-gate`: both branches are
      # single-crate now, so it resolves to the same thing, and it keeps working if
      # a second member ever returns.
      - name: Run Miri (${{ matrix.ref }}, strict)
        env:
          MIRIFLAGS: >-
            -Zmiri-ignore-leaks
            -Zmiri-disable-isolation
            -Zmiri-strict-provenance
        run: |
          cargo miri test --workspace --all-features -- --skip fixed_alias_zero_size_compile_fail --skip serializable_secret_misuse

  # Regression canary for the `if:`-gated split above. Every trigger this
  # workflow declares currently maps to one of the two jobs, so at least one
  # always runs. Add a trigger without extending an `if:` and both would skip
  # — and a workflow whose jobs all skipped reports **success**, so the gap
  # would be invisible on the checks list. Fail loudly instead. See #169.
  guard:
    name: at least one Miri job ran
    needs: [miri, miri-scheduled]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if every job was skipped
        # Reads every job listed in `needs:` above, so adding a job there is the
        # only edit required -- no job name is repeated in this script.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          echo "$NEEDS"
          if ! printf '%s' "$NEEDS" | jq -e 'any(.[].result; . != "skipped")' > /dev/null; then
            echo "::error::No job ran for event '$GITHUB_EVENT_NAME'. A trigger was added without extending an 'if:' condition, so this workflow would have reported success having executed nothing."
            exit 1
          fi
