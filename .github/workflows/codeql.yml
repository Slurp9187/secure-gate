name: CodeQL

# Advanced setup, replacing the repository's CodeQL default setup, which can only scan the
# default branch. This file scans pushes and pull requests on both `main` and `release/0.8`,
# and must exist on both branches for that. Activated by the repository variable
# CODEQL_ADVANCED = true (already set); the gate stays so the file can be copied to a
# branch or fork where default setup is still on, whose SARIF upload would be rejected.
# Background: docs/design/ci_cross_branch_coverage.md.

on:
  push:
    branches: [main, "release/0.8"]
  pull_request:
    branches: [main, "release/0.8"]
  schedule:
    # Weekly, matching the cadence default setup used. Monday 07:00 UTC, two hours
    # after the weekly sweep (05:00) so the two do not contend.
    #
    # This fires only from the default branch -- GitHub raises scheduled events
    # nowhere else -- so the copy of this file on `release/0.8` never runs on the
    # cron, and a scheduled run here analyses `main` only (there is no cross-ref
    # checkout: CodeQL results must be attributed to the ref they came from).
    # `release/0.8` is covered by the push and pull_request triggers above, which
    # is why this file has to exist on that branch too.
    - cron: "0 7 * * 1"
  # Needed to scan a branch on demand -- without it the Actions UI shows no "Run
  # workflow" button and `gh workflow run codeql.yml` fails. That matters most
  # right after activation, when `release/0.8` has never been analysed and the
  # alternative is pushing a commit or waiting until Monday.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes. Every other run
# (pushes to `main`, the schedule, manual dispatch) gets a group of its own and is never
# cancelled, so each `main` commit keeps a complete result to check a release tag against.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # See the note at the top of this file.
    if: vars.CODEQL_ADVANCED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Required to upload results to the code-scanning API.
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the languages default setup had configured.
        language: [actions, rust]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # The query suite is left at the action's default, which matches the
          # `default` suite that default setup was configured with. Raising it
          # to `security-extended` changes the alert set and is a separate
          # decision -- it should not ride along with this migration.

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
