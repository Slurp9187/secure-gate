name: Security audit

on:
  # NOTE: no `schedule:` here, deliberately. GitHub raises scheduled events
  # only from the default branch, so a cron block on this branch would never
  # fire -- it would read as coverage that does not exist. The weekly run
  # against this branch is hosted on `main`, which checks `release/0.8` out
  # explicitly. See issue #169.
  push:
    branches: [main, "release/0.8"]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Audits the ref that triggered the event (dependency changes on push / PR).
  audit:
    name: cargo audit (event ref)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  # Scheduled sweep over BOTH release lines. Scheduled workflows only run from
  # the default branch, so the LTS lockfile must be checked out explicitly —
  # its older pinned dependencies are the more likely place for advisories to
  # accumulate.
  audit-scheduled:
    name: cargo audit (${{ matrix.ref }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main, "release/0.8"]
    steps:
      - name: Checkout ${{ matrix.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  # Regression canary for the `if:`-gated split above. Every trigger this
  # workflow declares currently maps to one of the two jobs, so at least one
  # always runs. Add a trigger without extending an `if:` and both would skip
  # â€” and a workflow whose jobs all skipped reports **success**, so the gap
  # would be invisible on the checks list. Fail loudly instead. See #169.
  guard:
    name: at least one audit job ran
    needs: [audit, audit-scheduled]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if every job was skipped
        # Reads every job listed in `needs:` above, so adding a job there is the
        # only edit required -- no job name is repeated in this script.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          echo "$NEEDS"
          if ! printf '%s' "$NEEDS" | jq -e 'any(.[].result; . != "skipped")' > /dev/null; then
            echo "::error::No job ran for event '$GITHUB_EVENT_NAME'. A trigger was added without extending an 'if:' condition, so this workflow would have reported success having executed nothing."
            exit 1
          fi
