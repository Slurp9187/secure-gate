name: CI main/0.9

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "secure-gate-core/**"
      - "secure-gate-compat/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "secure-gate-core/**"
      - "secure-gate-compat/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt – check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable + rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  docs:
    name: rustdoc – docs.rs feature set
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # `--all-features` matches `[package.metadata.docs.rs] all-features = true`, so
      # the *feature set* is the one docs.rs builds and readers actually see. It does
      # not match docs.rs in any other respect — that is what the nightly step below is
      # for. `--no-deps` is right for both: a docs.rs page documents only the target
      # crate and links dependency items out to their own docs.rs pages, so skipping
      # dependencies is closer to what ships, not farther from it.
      - name: cargo doc – secure-gate (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --package secure-gate

      # docs.rs builds on nightly with `--cfg docsrs`, which switches on the `doc_cfg`
      # feature gate that produces the per-feature badges. This is the only step that
      # reproduces that, so it has to be able to fail the build: a rename of the gate
      # breaks docs.rs and nothing else, and it has been renamed before —
      # `doc_auto_cfg` was removed in 1.92 and merged into `doc_cfg`.
      #
      # Deliberately WITHOUT `-D warnings`, which is what makes blocking safe here. A
      # removed or renamed feature gate is a hard error (E0557) and still fails; a new
      # nightly rustdoc lint is only a warning and cannot hold up an unrelated merge.
      - name: Install Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - name: cargo doc – docs.rs configuration (nightly, hard errors only)
        env:
          RUSTDOCFLAGS: --cfg docsrs
        run: cargo +nightly doc --no-deps --all-features --package secure-gate

  lint:
    name: Lint (${{ matrix.package }}/${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no features
            package: secure-gate
            features: "--no-default-features"
          - name: rand (no_std)
            package: secure-gate
            features: "--no-default-features --features=rand"
          - name: full
            package: secure-gate
            features: "--features=full"
          - name: all features
            package: secure-gate
            features: "--all-features"
          - name: no features
            package: secure-gate-compat
            features: "--no-default-features"
          # `--no-default-features` deliberately: `secrecy-compat` is experimental and
          # must stand on its own rather than lean on whatever `default` happens to be.
          # It is also deliberately reachable from no other feature — see the note on
          # the feature definition in the compat manifest.
          - name: secrecy-compat (standalone)
            package: secure-gate-compat
            features: "--no-default-features --features=secrecy-compat"
          - name: all features
            package: secure-gate-compat
            features: "--all-features"
          # Each serde feature on its own. Only `secrecy-compat` happened to drag
          # `serde` in, so neither of these compiled alone and no row noticed.
          - name: serde-serialize only
            package: secure-gate-compat
            features: "--features=serde-serialize"
          - name: serde-deserialize only
            package: secure-gate-compat
            features: "--features=serde-deserialize"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Clippy (${{ matrix.name }})
        run: cargo clippy -p ${{ matrix.package }} --tests --benches ${{ matrix.features }}

      - name: Doctests (${{ matrix.name }})
        run: cargo test -p ${{ matrix.package }} --doc ${{ matrix.features }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Baseline ──────────────────────────────────────────────────────────
          - name: Default features
            features: ""

          - name: No features
            features: "--no-default-features"

          # ── Alloc / std ──────────────────────────────────────────────────
          - name: alloc explicit
            features: "--no-default-features --features=alloc"

          - name: std explicit
            features: "--no-default-features --features=std"

          # ── Rand ──────────────────────────────────────────────────────────────
          # rand no longer forces alloc: Fixed::from_random() works without heap.
          # Dynamic::from_random() is covered by the alloc + rand entry below.
          - name: rand (no_std, Fixed only)
            features: "--no-default-features --features=rand"

          - name: alloc + rand
            features: "--no-default-features --features=alloc,rand"

          # ── Constant-time equality ────────────────────────────────────────────
          # alloc is required so Dynamic-backed tests in ct_eq_tests and
          # proptest_suite/ct_eq.rs (gated on ct-eq + alloc) are exercised.
          - name: ct-eq + alloc
            features: "--no-default-features --features=ct-eq,alloc"

          # ── Encoding ──────────────────────────────────────────────────────────
          # Encoding traits return String and require alloc; integration tests
          # import the traits, so alloc is needed to compile the test binaries.
          # True of every row here except the last. The bech32 no-alloc row builds
          # because every item in encoding_suite/bech32*.rs is gated on
          # all(encoding-bech32, alloc): the suite compiles out, and what that row
          # actually exercises is tests/newtype_nostd.rs.
          - name: encoding (all formats)
            features: "--no-default-features --features=alloc,encoding"

          - name: encoding-hex only
            features: "--no-default-features --features=alloc,encoding-hex"

          - name: encoding-base32 only
            features: "--no-default-features --features=alloc,encoding-base32"

          - name: encoding-base64 only
            features: "--no-default-features --features=alloc,encoding-base64"

          - name: encoding-bech32 only (BIP-173 + BIP-350)
            features: "--no-default-features --features=alloc,encoding-bech32"

          # No `alloc`: the only row that expands a consumer `fixed_newtype!` on the
          # no-alloc path. Its absence is what let the BIP-173 decode constructors sit
          # inside `__sg_if_alloc!` undetected.
          - name: encoding-bech32, no alloc
            features: "--no-default-features --features=encoding-bech32"

          # ── Serde ─────────────────────────────────────────────────────────────
          - name: serde (serialize + deserialize)
            features: "--no-default-features --features=serde"

          - name: serde-serialize only
            features: "--no-default-features --features=serde-serialize"

          - name: serde-deserialize only
            features: "--no-default-features --features=serde-deserialize"

          # ── Cloneable ─────────────────────────────────────────────────────────
          - name: alloc + cloneable
            features: "--no-default-features --features=alloc,cloneable"

          # ── Full ──────────────────────────────────────────────────────────────
          - name: full
            features: "--features=full"

          # `full` deliberately excludes `std`, so tests gated on `std` together
          # with another feature (e.g. the reader/writer forwarding on a
          # `dynamic_newtype!` over `Vec<u8>`, which needs `std` + `encoding-hex`)
          # compile in no other matrix entry. This one compiles all of them.
          - name: all features (full + std)
            features: "--all-features"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests (${{ matrix.name }})
        # The trybuild snapshots are intentionally blessed on Rust 1.85.
        # Stable rustc diagnostics drift over time (dynamic_string_no_hex broke
        # when stable switched E0599's candidate note to a single-line form), so
        # skip those cases here; the `compile-fail` job below runs them on 1.85.
        # `--skip` matches substrings, and every compile-fail test is named
        # `*_compile_fail`, so new cases are excluded automatically. The one
        # legacy name without the suffix is listed explicitly.
        run: cargo test -p secure-gate --tests ${{ matrix.features }} -- --skip compile_fail --skip serializable_secret_misuse

  # ---------------------------------------------------------------------------
  # Release-profile test job — build-invariance oracle
  #
  # The error API guarantees identical shapes and messages in debug and release
  # builds, and several tests assert exact Display output. The matrix above runs
  # the debug profile only, so run the runtime suites once under --release to
  # keep the build-invariance property continuously verified.
  #
  # trybuild compile-fail tests are skipped in both crates: they assert compiler
  # diagnostics (blessed against the pinned toolchain) which drift on stable and
  # are independent of the build profile — the property this job guards is
  # runtime behavior. Core cases are skipped by the `compile_fail` name suffix
  # (plus the one legacy name); keep the compat list in sync with the test
  # names in secure-gate-compat/tests/compile_fail_tests.rs.
  # ---------------------------------------------------------------------------
  test-release:
    name: Test – release profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run core tests (release, full features)
        run: cargo test -p secure-gate --tests --release --features=full -- --skip compile_fail --skip serializable_secret_misuse

      - name: Run compat tests (release, all features)
        run: cargo test -p secure-gate-compat --release --all-features -- --skip fixed_alias_zero_size_compile_fail --skip serializable_secret_misuse --skip compat_no_deref --skip compat_no_asref --skip compat_no_debug_without_marker

      # Compat's runtime suites otherwise run only under `--release`. Debug is where
      # `debug_assertions` and overflow checks are live, and it is the profile a
      # contributor actually runs, so the same suites run here too. Core already has
      # debug coverage from the `test` matrix above.
      - name: Run compat tests (debug, all features)
        run: cargo test -p secure-gate-compat --all-features -- --skip fixed_alias_zero_size_compile_fail --skip serializable_secret_misuse --skip compat_no_deref --skip compat_no_asref --skip compat_no_debug_without_marker

  # ---------------------------------------------------------------------------
  # no_std job — cross-build for a bare-metal target
  #
  # The hosted "--no-default-features" jobs above silently link std, so they
  # cannot catch std leakage (missing #![no_std], dependencies with default
  # `std` features, prelude-only type usage). Cross-building for a target with
  # no std at all is the only authoritative check. `rand` is excluded: it needs
  # a user-configured getrandom backend on bare metal (documented in lib.rs).
  # ---------------------------------------------------------------------------
  no-std:
    name: no_std – cross-build (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable + thumbv7em target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cross-build library for bare metal (feature matrix)
        run: |
          set -eux
          for features in \
            "" \
            "encoding-hex" \
            "encoding-base32" \
            "encoding-base64" \
            "encoding-bech32" \
            "encoding-hex,encoding-base32,encoding-base64,encoding-bech32" \
            "ct-eq" \
            "ct-eq,encoding-hex,encoding-base32,encoding-base64,encoding-bech32"
          do
            cargo build -p secure-gate --lib \
              --target thumbv7em-none-eabihf \
              --no-default-features \
              ${features:+--features "$features"}
          done

      - name: Cross-build compat for bare metal
        # secure-gate-compat is unconditionally #![no_std] (alloc-based shims).
        run: |
          set -eux
          cargo build -p secure-gate-compat --lib --target thumbv7em-none-eabihf
          cargo build -p secure-gate-compat --lib --target thumbv7em-none-eabihf --features secrecy-compat

  # ---------------------------------------------------------------------------
  # MSRV job — verify declared rust-version is actually buildable
  #
  # Runs `cargo check` (not full tests) on the MSRV toolchain to catch any
  # accidental use of post-1.85 APIs before they reach a release. This crate
  # uses Rust edition 2024, which requires rustc ≥ 1.85.0. Clippy's
  # --version-lint flag catches MSRV violations in the main `test` job, but
  # a real toolchain check is the authoritative guard.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV – cargo check (1.85)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.85"

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Update Cargo.lock with MSRV toolchain
        run: cargo +1.85 update

      - name: cargo check – default features
        run: cargo +1.85 check

      - name: cargo check – full features
        run: cargo +1.85 check --features=full

      # `check` with `default`/`full` compiles the library only: neither implies
      # `std`, and neither builds test targets. That let a test file stop compiling
      # on the declared MSRV while every job stayed green — `--all-features
      # --all-targets` is the configuration that catches it.
      - name: cargo check – all features, all targets
        run: cargo +1.85 check --workspace --all-features --all-targets

  # ---------------------------------------------------------------------------
  # Compile-fail job — API-surface enforcement on the blessing toolchain
  #
  # The trybuild snapshots assert compiler diagnostics, which drift on stable, so
  # every other test job skips them. That left them running in no CI job at all:
  # the negative API guarantees (no `Deref`/`AsRef` on the secret wrappers, no
  # `Serialize` without `SerializableSecret`, no zero-size aliases, no encoding
  # methods on `Dynamic<String>`) were asserted in prose and enforced nowhere.
  #
  # This job runs exactly those tests, pinned to 1.85 — the toolchain the .stderr
  # files are blessed against — so the diagnostics are stable by construction.
  # Regenerate snapshots with: TRYBUILD=overwrite cargo +1.85 test compile_fail
  # ---------------------------------------------------------------------------
  compile-fail:
    name: Compile-fail – trybuild (1.85)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.85"

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run core compile-fail tests
        run: cargo +1.85 test -p secure-gate --features=full --test compile_fail_tests

  # ---------------------------------------------------------------------------
  # AddressSanitizer job — heap zeroization oracle
  #
  # Runs only the `heap_zeroize` integration test binary with ASan + LeakSanitizer
  # enabled. Requires nightly + `-Z build-std` to rebuild std with instrumentation.
  # This job catches heap-use-after-free, buffer overflows, and memory leaks that
  # Miri and the ProxyAllocator approach might miss at the allocator level.
  # ---------------------------------------------------------------------------
  asan-heap:
    name: ASan – heap zeroization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly + rust-src
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rust-src

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run heap_zeroize with AddressSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=address -Zsanitizer=leak -C debuginfo=2"
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:symbolize=1"
        run: >
          cargo +nightly test
          --features alloc,encoding-hex,encoding-base32,encoding-base64,encoding-bech32
          --test heap_zeroize
          -Z build-std
          --target x86_64-unknown-linux-gnu
