name: "CI · 0.8 (MSRV 1.70)"

# The 0.8 line is a courtesy line for Rust 1.70: it keeps a slim CI (tests and the DSE check
# on its MSRV, tests on stable, clippy and rustdoc, rustfmt, an embedded build). Fuzzing,
# Miri, CodeQL and the audits run from `main`.

on:
  pull_request:
    branches: [release/0.8]
  push:
    branches: [release/0.8]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-msrv:
    name: "0.8 · test (1.70)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.70
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.70"

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # The compile-fail cases are skipped here and run in the step below, with the
      # feature set their snapshots are blessed against. Every one is named
      # `*_compile_fail` except the legacy `serializable_secret_misuse`.
      - name: cargo test (default features)
        run: cargo +1.70 test -p secure-gate --locked -- --skip compile_fail --skip serializable_secret_misuse

      - name: cargo test (all features)
        run: cargo +1.70 test -p secure-gate --locked --all-features -- --skip compile_fail --skip serializable_secret_misuse

      # The trybuild snapshots are blessed against 1.70 (rust-toolchain.toml).
      # Regenerate with: TRYBUILD=overwrite cargo +1.70 test --features=full --test compile_fail_tests
      - name: Compile-fail tests (trybuild)
        run: cargo +1.70 test -p secure-gate --locked --features=full --test compile_fail_tests

      # Builds `src/bin/asm_check.rs` in release with `--emit=asm` and checks that the
      # volatile zero-stores in `Fixed`'s drop survive optimization. `#[ignore]`d by default
      # because it runs a release build of its own.
      - name: DSE check (asm_dse_check)
        run: cargo +1.70 test -p secure-gate --locked --test asm_dse_check -- --ignored --nocapture

  test-stable:
    name: "0.8 · test (stable)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Stable's diagnostics drift from the 1.70 snapshots, so the compile-fail cases
      # run only in the 1.70 job.
      - name: cargo test (default features)
        run: cargo +stable test -p secure-gate --locked -- --skip compile_fail --skip serializable_secret_misuse

      - name: cargo test (all features)
        run: cargo +stable test -p secure-gate --locked --all-features -- --skip compile_fail --skip serializable_secret_misuse

  clippy:
    name: "0.8 · clippy + rustdoc"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.70 + clippy
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.70"
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo +1.70 clippy -p secure-gate --locked --all-targets --all-features -- -D warnings

      # On 1.70 on purpose: rustdoc 1.70 has ICEd on intra-doc links through grouped
      # `pub use` re-exports, which docs.rs (nightly) never hits. `-D warnings` also
      # catches broken intra-doc links.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo +1.70 doc -p secure-gate --locked --no-deps --all-features

  embedded:
    name: "0.8 · embedded build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A hosted `--no-default-features` build links std anyway; only a target with no
      # std at all catches std leaking into the library.
      - name: Install Rust 1.70 + thumbv7em target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.70"
          target: thumbv7em-none-eabihf

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo build (no default features)
        run: cargo +1.70 build -p secure-gate --locked --lib --target thumbv7em-none-eabihf --no-default-features

      - name: cargo build (alloc)
        run: cargo +1.70 build -p secure-gate --locked --lib --target thumbv7em-none-eabihf --no-default-features --features alloc

  fmt:
    name: "0.8 · fmt"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # rustfmt output differs across toolchains, and the tree is formatted with 1.70.
      - name: Install Rust 1.70 + rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.70"
          components: rustfmt

      - name: cargo fmt --check
        run: cargo +1.70 fmt --all --check

  ci-passed:
    name: "0.8 · CI passed"
    if: always()
    needs: [test-msrv, test-stable, clippy, fmt, embedded]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "needs: ${{ toJSON(needs) }}"
          exit 1
