# .github/workflows/fuzz-quick.yml
name: Fuzz (quick smoke)

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "fuzz/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fuzz-quick.yml"
  pull_request:
    paths:
      - "fuzz/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fuzz-quick.yml"
  workflow_dispatch: # manual trigger when you need a long run

# A newer push to the same pull request cancels the run it supersedes. Every other run
# (pushes to `main`, the schedule, manual dispatch) gets a group of its own and is never
# cancelled, so each `main` commit keeps a complete result to check a release tag against.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        target: [expose, mut, parsing, encoding, serde, ct_eq]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Quick smoke test – ${{ matrix.target }} (90 s)
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -fork=1 \
            -max_total_time=90 \
            -timeout=30

      - name: Upload crash artifacts (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/**
          retention-days: 7

