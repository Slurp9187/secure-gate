name: Weekly sweep (main and release/0.8)

# Scheduled checks of both release lines. GitHub raises scheduled events only from the
# default branch, so a `schedule:` on `release/0.8` would never fire; this workflow checks
# that branch out instead (#169, docs/design/ci_cross_branch_coverage.md).
#
# None of these jobs use the dependency cache: they run another branch's code in the
# default branch's context, and must not write the shared cache.
#
# This workflow has only scheduled and manual triggers, so no job here is split by `if:`
# and none can be skipped by accident. The pull-request checks live in ci.yml.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Advisories are time-sensitive, and the older pinned lockfile on `release/0.8` is the
  # more likely place for them to accumulate.
  audit:
    name: cargo audit (${{ matrix.ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ref: [main, "release/0.8"]
    steps:
      - name: Checkout ${{ matrix.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  dse:
    name: DSE (${{ matrix.ref }})
    strategy:
      fail-fast: false
      matrix:
        ref: [main, "release/0.8"]
    uses: ./.github/workflows/dse.yml
    with:
      ref: ${{ matrix.ref }}
      cache: false

  miri:
    name: Miri (${{ matrix.ref }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: main
            label: main
          - ref: "release/0.8"
            label: release-0.8
    uses: ./.github/workflows/miri.yml
    with:
      ref: ${{ matrix.ref }}
      label: ${{ matrix.label }}
      cache: false
